# Chat gateway strings for the IADB Brazil deployment (mcp.okfn.org/iati/).
#
# Same mechanism as gateway-overrides.yaml (the generic IATI copy): the
# deployment Dockerfile ADDs this file as <gateway>/static/i18n/overrides.yaml
# and the gateway merges it on top of its bundled locale files. The server
# behind this gateway runs with MCP_IATI_SAMPLE=iadb-Brazil.xml (Dashboard
# dataset iadb-br), so the copy names the publisher and the country.
#
# The plugin's own content (tool descriptions, sample questions, answers)
# is English-only; the gateway shell is translated per locale, so the
# es/pt blocks carry the same copy in those languages.

en:
  nav:
    brand: Open Data AI Explorer
  landing:
    title: Ask the IADB's IATI data for Brazil
    tagline: 'Answers built only from the official IATI activity file for Brazil published by the <a href="https://dashboard.iatistandard.org/publishers/iadb/">Inter-American Development Bank (IADB)</a>: its operations and transactions in the country, as declared under the IATI standard. Every reply comes from a tool call over that file, never from the model''s own knowledge.'
    placeholder: Ask about IADB activities in Brazil, sectors or transactions...
    footer:
      tech: 'Powered by the OKFN MCP server and the <a href="https://github.com/okfn/mcp-iati">mcp-iati</a> plugin over the official <a href="https://iatistandard.org/">IATI</a> publication of the <a href="https://dashboard.iatistandard.org/publishers/iadb/">IADB</a> (see the <a href="#" id="landing-footer-tools">data sources</a> below).'

es:
  nav:
    brand: Open Data AI Explorer
  landing:
    title: Pregúntale a los datos IATI del BID para Brasil
    tagline: 'Respuestas construidas solo con el archivo oficial de actividades IATI de Brasil que publica el <a href="https://dashboard.iatistandard.org/publishers/iadb/">Banco Interamericano de Desarrollo (BID)</a>: sus operaciones y transacciones en el país, tal como las declara bajo el estándar IATI. Cada respuesta sale de una herramienta sobre ese archivo, nunca del conocimiento propio del modelo.'
    placeholder: Pregunta sobre actividades del BID en Brasil, sectores o transacciones...
    footer:
      tech: 'Construido con el servidor MCP de OKFN y el plugin <a href="https://github.com/okfn/mcp-iati">mcp-iati</a> sobre la publicación oficial <a href="https://iatistandard.org/">IATI</a> del <a href="https://dashboard.iatistandard.org/publishers/iadb/">BID</a> (ver las <a href="#" id="landing-footer-tools">fuentes de datos</a> abajo).'

pt:
  nav:
    brand: Open Data AI Explorer
  landing:
    title: Pergunte aos dados IATI do BID sobre o Brasil
    tagline: 'Respostas construídas apenas com o arquivo oficial de atividades IATI do Brasil publicado pelo <a href="https://dashboard.iatistandard.org/publishers/iadb/">Banco Interamericano de Desenvolvimento (BID)</a>: suas operações e transações no país, conforme declaradas sob o padrão IATI. Cada resposta vem de uma ferramenta sobre esse arquivo, nunca do conhecimento próprio do modelo.'
    placeholder: Pergunte sobre atividades do BID no Brasil, setores ou transações...
    footer:
      tech: 'Desenvolvido com o servidor MCP da OKFN e o plugin <a href="https://github.com/okfn/mcp-iati">mcp-iati</a> sobre a publicação oficial <a href="https://iatistandard.org/">IATI</a> do <a href="https://dashboard.iatistandard.org/publishers/iadb/">BID</a> (veja as <a href="#" id="landing-footer-tools">fontes de dados</a> abaixo).'
