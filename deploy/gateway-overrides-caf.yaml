# Chat gateway strings for the CAF deployment (mcp.okfn.org/iati-caf/).
#
# Same mechanism as gateway-overrides.yaml (the generic IATI copy): the
# deployment Dockerfile ADDs this file as <gateway>/static/i18n/overrides.yaml
# and the gateway merges it on top of its bundled locale files. The server
# behind this gateway runs with MCP_IATI_DATASET=caf-actfile-46008-2603, so
# the copy names the publisher and links to its official page in the IATI
# Dashboard (which replaced the IATI Registry in December 2025).
#
# The plugin's own content (tool descriptions, sample questions, answers)
# is English-only; the gateway shell is translated per locale, so the
# es/pt blocks carry the same copy in those languages.

en:
  nav:
    brand: Open Data AI Explorer
  landing:
    title: Ask CAF's IATI data
    tagline: 'Answers built only from the official IATI activity file published by <a href="https://dashboard.iatistandard.org/publishers/caf/">CAF, Development Bank of Latin America and the Caribbean</a>: its development activities and transactions, as declared under the IATI standard. Every reply comes from a tool call over that file, never from the model''s own knowledge.'
    placeholder: Ask about CAF activities, countries, sectors or transactions...
    footer:
      tech: 'Powered by the OKFN MCP server and the <a href="https://github.com/okfn/mcp-iati">mcp-iati</a> plugin over the official <a href="https://iatistandard.org/">IATI</a> publication of <a href="https://dashboard.iatistandard.org/publishers/caf/">CAF</a> (see the <a href="#" id="landing-footer-tools">data sources</a> below).'

es:
  nav:
    brand: Open Data AI Explorer
  landing:
    title: Preguntale a los datos IATI de CAF
    tagline: 'Respuestas construidas solo con el archivo oficial de actividades IATI que publica <a href="https://dashboard.iatistandard.org/publishers/caf/">CAF, Banco de Desarrollo de America Latina y el Caribe</a>: sus actividades y transacciones de desarrollo, tal como las declara bajo el estandar IATI. Cada respuesta sale de una herramienta sobre ese archivo, nunca del conocimiento propio del modelo.'
    placeholder: Pregunta sobre actividades, paises, sectores o transacciones de CAF...
    footer:
      tech: 'Construido con el servidor MCP de OKFN y el plugin <a href="https://github.com/okfn/mcp-iati">mcp-iati</a> sobre la publicacion oficial <a href="https://iatistandard.org/">IATI</a> de <a href="https://dashboard.iatistandard.org/publishers/caf/">CAF</a> (ver las <a href="#" id="landing-footer-tools">fuentes de datos</a> abajo).'

pt:
  nav:
    brand: Open Data AI Explorer
  landing:
    title: Pergunte aos dados IATI do CAF
    tagline: 'Respostas construidas apenas com o arquivo oficial de atividades IATI publicado pelo <a href="https://dashboard.iatistandard.org/publishers/caf/">CAF, Banco de Desenvolvimento da America Latina e Caribe</a>: suas atividades e transacoes de desenvolvimento, conforme declaradas sob o padrao IATI. Cada resposta vem de uma ferramenta sobre esse arquivo, nunca do conhecimento proprio do modelo.'
    placeholder: Pergunte sobre atividades, paises, setores ou transacoes do CAF...
    footer:
      tech: 'Desenvolvido com o servidor MCP da OKFN e o plugin <a href="https://github.com/okfn/mcp-iati">mcp-iati</a> sobre a publicacao oficial <a href="https://iatistandard.org/">IATI</a> do <a href="https://dashboard.iatistandard.org/publishers/caf/">CAF</a> (veja as <a href="#" id="landing-footer-tools">fontes de dados</a> abaixo).'
